workflows:
  tedflix-android-debug:
    name: Tedflix Android Debug
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      java: 17
    scripts:
      - name: Build debug APK
        script: ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk
    publishing:
      scripts:
        - name: Build summary
          script: echo "APK gerado em app/build/outputs/apk/debug/"
