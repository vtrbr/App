<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#050609">
  <title>Tedflix Studio</title>
  <link rel="stylesheet" href="css/style.css?v=studio-1">
</head>
<body>
  <div id="app" class="app-shell">
    <section id="login-screen" class="login-screen">
      <div class="login-backdrop"></div>
      <div class="login-card">
        <img class="login-banner" src="assets/tedflix_auth_banner.png" alt="">
        <div class="login-content">
          <img class="studio-logo" src="assets/tedflix_logo.png" alt="Tedflix">
          <span class="studio-label">STUDIO</span>
          <h1>Acesso administrativo</h1>
          <p class="muted">Entre para gerenciar sua plataforma.</p>
          <form id="login-form">
            <label>E-mail administrativo<input id="login-email" type="email" autocomplete="username" required placeholder="admin@tedflix.com"></label>
            <label>Senha<input id="login-password" type="password" autocomplete="current-password" required placeholder="Sua senha"></label>
            <button class="primary-button" type="submit">Entrar no Studio</button>
            <p id="login-error" class="form-error"></p>
          </form>
        </div>
      </div>
    </section>

    <section id="studio-screen" class="studio-screen hidden">
      <aside class="sidebar">
        <nav id="side-nav">
          <button class="nav-item active" data-page="dashboard"><span>⌂</span>Dashboard</button>
          <button class="nav-item" data-page="users"><span>♙</span>Usuários</button>
          <button class="nav-item" data-page="access"><span>＋</span>Criar acesso</button>
          <button class="nav-item" data-page="notifications"><span>♧</span>Notificações</button>
          <button class="nav-item" data-page="history"><span>◷</span>Histórico</button>
          <button class="nav-item" data-page="logs"><span>☷</span>Logs</button>
          <button class="nav-item" data-page="settings"><span>⚙</span>Configurações</button>
        </nav>
        <button id="logout-button" class="logout-button"><span>↪</span>Sair</button>
        <div class="admin-mini"><div id="admin-avatar" class="avatar">A</div><div><strong id="admin-name">Administrador</strong><small id="admin-email">admin@tedflix.com</small></div></div>
      </aside>

      <main class="main-content">
        <header class="topbar"><div class="mobile-brand"><img src="assets/tedflix_logo.png" alt="Tedflix"><span>STUDIO</span></div><div class="topbar-actions"><button class="icon-button" id="refresh-button" title="Atualizar" aria-label="Atualizar">↻</button><button class="notification-button" id="top-notifications" title="Notificações" aria-label="Notificações">♧<b id="notification-count" class="badge hidden">0</b></button><div id="top-admin-avatar" class="avatar small" aria-label="Administrador">A</div></div></header>
        <div id="page-root" class="page-root"></div>
      </main>
    </section>
  </div>
  <div id="toast" class="toast"></div>
  <script src="js/app.js?v=studio-1"></script>
</body>
</html>
